<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | The Rapids White Water Rafting</title>
  <meta name="description"
    content="Contact The Rapids White Water Rafting for reservations, trip information, customer support, and general inquiries.">
  <meta name="author" content="Vivian Okosun">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/wwr-logo.jpg" alt="The Rapids">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="contact-info">
      <h1>The Rapids White Water Rafting Company</h1>

      <p>42 Broad Street</p>
      <p>Lagos Island, Lagos</p>
      <p>Phone: +1 (999) 999-9999</p>
      <p>Email: info@therapids.com</p>
    </section>

    <section class="contact-grid">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d172364.74479588383!2d3.3703069534142993!3d6.497305280663552!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1785702830437!5m2!1sen!2sng"
        allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

      <form action="#" method="post">
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-row">
          <label>Purpose of Message</label>

          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="general" name="purpose" value="general">
              <label for="general">General Inquiry</label>
            </div>

            <div class="radio-option">
              <input type="radio" id="reservation" name="purpose" value="reservation">
              <label for="reservation">Reservation Question</label>
            </div>

            <div class="radio-option">
              <input type="radio" id="website" name="purpose" value="website">
              <label for="website">Website Suggestion</label>
            </div>
          </div>
        </div>

        <label for="message">Message</label>
        <textarea name="message" id="message" rows="6"></textarea>

        <div class="checkbox-row">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </section>

    <section class="employees-section">
      <h2>We are Here to Serve You</h2>

      <div class="employee-gallery">
        <figure>
          <img src="images/employee1.jfif" alt="John Smith">
          <figcaption>John Smith - River Guide</figcaption>
        </figure>

        <figure>
          <img src="images/employee2.jfif" alt="Sarah Jones">
          <figcaption>Sarah Jones - Reservation Manager</figcaption>
        </figure>

        <figure>
          <img src="images/employee3.jfif" alt="David Brown">
          <figcaption>David Brown - Safety Instructor</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <p>©️ 2026 ✨ The Rapids ✨ Vivian Okosun</p>
    <nav class="socialmedia">
      <a href="https://linkedin.com/in/vivian-okosun"><img src="images/linkedin.avif"
          alt="LinkedIn Icon"></a>
      <a href="https://instagram.com/vivianokosun"><img src="images/instagram.avif"
          alt="Instagram Icon"></a>
      <a href="https://x.com/vivianokosun"><img src="images/x-logo.avif" alt="x icon"></a>
    </nav>
  </footer>
</body>

</html>
